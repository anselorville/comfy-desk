[project]
name = "comfy-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "aiohttp>=3.11.8",
    "alembic",
    "anyio==4.7.0",
    "av>=14.2.0",
    "blake3",
    "comfy-aimdo>=0.2.12",
    "comfy-kitchen>=0.2.8",
    "comfyui-embedded-docs==0.4.3",
    "comfyui-frontend-package==1.42.10",
    "comfyui-workflow-templates==0.9.44",
    "einops",
    "fastapi==0.115.6",
    "filelock",
    "glfw",
    "httpx==0.28.1",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow>=11.0.0",
    "psutil",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "pyopengl",
    "python-multipart==0.0.20",
    "pyyaml",
    "requests",
    "safetensors>=0.4.2",
    "scipy",
    "sentencepiece",
    "simpleeval>=1.0.0",
    "spandrel",
    "sqlalchemy",
    "tokenizers>=0.13.3",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchsde",
    "torchvision==0.20.1",
    "tqdm",
    "transformers>=4.50.3",
    "uvicorn[standard]==0.32.1",
    "websockets==14.1",
    "yarl>=1.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pyright]
extraPaths = ["gateway"]
