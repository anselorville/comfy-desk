[project]
name = "comfy-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "aiohttp>=3.11.8",
    "aiosqlite==0.20.0",
    "anyio==4.7.0",
    "av>=16.0.0",
    "blake3",
    "comfy-aimdo==0.4.13",
    "comfy-angle",
    "comfy-kitchen==0.2.31",
    "comfyui-embedded-docs==0.5.10",
    "comfyui-frontend-package==1.49.6",
    "comfyui-workflow-templates==0.11.44",
    "einops",
    "fastapi==0.115.6",
    "filelock",
    "sse-starlette>=2.0.0",
    "glfw",
    "httpx==0.28.1",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow>=11.0.0",
    "psutil",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "pyopengl",
    "python-multipart==0.0.20",
    "pyyaml",
    "requests",
    "safetensors>=0.4.2",
    "scipy",
    "sentencepiece",
    "simpleeval>=1.0.0",
    "spandrel",
    "sqlalchemy",
    "tokenizers>=0.13.3",
    "torch",
    "torchaudio",
    "torchsde",
    "torchvision",
    "tqdm",
    "transformers>=4.50.3",
    "uvicorn[standard]==0.32.1",
    "websockets==14.1",
    "yarl>=1.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pyright]
extraPaths = ["gateway"]
